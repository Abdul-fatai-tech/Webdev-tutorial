<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <style>
body{
    margin: 0;
font-family:Arial,  sans-serif ;
background-color: #f4f4f4;
color: #222;
}

header{
    background-color: #1f4e5f;
    color: #fff;
    text-align: center;
    padding: 20px;
}
header h1{
    margin: 0 0 15px;
}

nav a{
    color: #fff;
    text-decoration: none;
    margin: 0 15px;
    font-weight: bold;
}

nav a:hover{
    color: #ffd166;
}

main{
    max-width: 1100px;
margin: auto;
padding: 40px 20px;
min-height: 70vh;
}

.Breadcrumb{
    margin-bottom: 25px;
}
.Breadcrumb a{
    color: #1f4e5f;
    text-decoration: none;
    font-weight: bold;
    }
.Breadcrumb a:hover{
    text-decoration: underline;
}

form{
    width: 600px;
    margin-left: 0px;
    background-color: #fff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
}
form label{
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}
form input,
form textarea{
    width: 90%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
 border-radius: 5px;
 font-size: 16px;
}
form textarea{
    resize: vertical;
}
form button{
    background-color: #1f4e5f;
    color: #fff;
    border: none;
    padding: 12px 25px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}
form button:hover{
background-color: #163b48;
}
footer{
    background-color: #1f4e5f;
    color: #fff;
    text-align: center;
    padding: 20px;
}
footer a{
    color: #ffd166;
    text-decoration: none;
}





</style>
</head>

<body id="top">
    <!-- header -->
    <header>
        <h1>My Travel Gallery</h1>
        <!-- navigation menu -->
        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">gallery</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <!-- main content -->
    <main>
        <!-- Breadcrumb -->
        <div class="Breadcrumb">
            <a href="index.html">contact</a>
            
            
        </div>
        <!-- Welcome section -->
        <section>
            <h2>Contact Us</h2>
            <p>If you have any question or would you like to get in touch wuth us, please fill the form below.
            </p>
            <!-- contact form -->
            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required><br>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required><br>
                <label for="message">Massage</label><br>
                <label for="phone">Phone number</label>
                <textarea name="message" id="message" rows="6" cols="40" required></textarea><br>
                <button type="submit">Send Message</button><br>


            </form>
             <p class="back-to-top"><a href="#top">&#8593;</a></p>
        </section>
    </main>
    <!-- footer -->
    <footer>
        <p>&copy; 2026 My Travel Gallery</p>
        <p>
            <a href="mailto:gallery123@gmail.com">
                contact us
            </a>
        </p>
    </footer>
</body>

</html>
