<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="/register" method="POST">

        <fieldset>
            <legend>Registration Form</legend>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required minlength="3" placeholder="Haroon abdul-fatai">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="haroonfatai71@gmail.com">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="12345678">
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" placeholder="November 15, 1990">
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="">Select Country</option>
                <option value="us">United States</option>
                <option value="uk">United Kingdom</option>
            </select>
            <label for="bio">Bio:</label>
            <textarea id="bio" name="bio" rows="4"></textarea>
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">I agree to terms and conditions</label>
            <button type="submit">Register</button>
            <button type="reset">Clear Form</button>
        </fieldset>
    </form>

</body>

</html>
