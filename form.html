<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        [disabled] {
            opacity: 0.5;
            border: 3px solid blue;
            border-radius: 10px;
        }

        [type="pasword"] {
            border: 1px solid gray;
        }

        [class*="btn"] {
            padding: 10px;
            color: blue;
        }

        [src$=".jpg"] {
            border: 2px solid black;
            width: 200px;
            height: 200px;
            border-radius: 50%;
        }

        input::placeholder {
            color:blue ;
            font-style: italic;
        }
    </style>

</head>

<body>
    <img src="images/beach.jpg" alt="beach">
    <form action="/register" method="POST">
        <fieldset>
            <legend>Registration Form</legend><br>
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required minlength="3" placeholder="Haroon abdul-fatai"
                disabled><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required placeholder="haroonfatai71@gmail.com"><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required minlength="8" placeholder="12345678"><br>
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" placeholder="November 15, 1990"><br>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male"><br>
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="female"><br>
            <label for="female">Female</label><br>
            <label for="country">Country:</label><br>
            <select id="country" name="country"><br>
                <option value="">Select Country</option><br>
                <option value="us">United States</option><br>
                <option value="uk">United Kingdom</option><br>
            </select>
            <label for="bio">Bio:</label><br>
            <textarea id="bio" name="bio" rows="4" placeholder="Fill your Bio here....."></textarea><br>
            <input type="checkbox" id="agree" name="agree" required><br>
            <label for="agree">I agree to terms and conditions</label><br>
            <button class="btn" type="submit">Register</button><br>
            <button onclick="alert('hello!')" class="btn" type="reset">Clear Form</button><br>
            <button onclick="alert()" class="btn">UNDO</button>
            <button onclick="alert('Clicked!')">Click Me</button>
        </fieldset>
    </form>
</body>

</html>
